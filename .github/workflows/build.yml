
name: Build ALI SHAMS CONTROL

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP found"
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          if [ -f source/ALI_SHAMS_CONTROL/settings.gradle ]; then
            echo "PROJECT_DIR=source/ALI_SHAMS_CONTROL" >> "$GITHUB_ENV"
          elif [ -f source/settings.gradle ]; then
            echo "PROJECT_DIR=source" >> "$GITHUB_ENV"
          else
            echo "Project files not found"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALI-SHAMS-CONTROL-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
