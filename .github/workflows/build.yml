
name: Build MarkazKar APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -type f -iname "MarkazKar_WireGuard_Ready*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            find . -maxdepth 4 -type f
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Components
        shell: bash
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        working-directory: project
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: project
        run: |
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh project/app/build/outputs/apk/debug/
          test -f project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarkazKar-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
