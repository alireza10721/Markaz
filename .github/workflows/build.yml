
name: Build Markaz Kar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Markaz_Kar_Android_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project on GitHub
        run: |
          unzip -o Markaz_Kar_Android_Project.zip -d source
          cp -a source/. .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Markaz-Kar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
